name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'starmedia-tests.log'
          npm test *>&1 | Tee-Object -FilePath $testLog
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $tail = (Get-Content -LiteralPath $testLog -Tail 120) -join "`n"
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=StarMedia test failure::$annotation"
            exit $testExitCode
          }

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build renderer
        run: npm run build:web
