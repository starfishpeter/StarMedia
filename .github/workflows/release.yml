name: Release Windows ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and verify Windows ZIP
        run: npm run package:win

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath release -Filter 'StarMedia-*-win.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows ZIP, found $($archives.Count)"
          }
          $archive = $archives[0]
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $archive.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME $archive.FullName --generate-notes --title "StarMedia $env:GITHUB_REF_NAME" --repo $env:GITHUB_REPOSITORY
          }
