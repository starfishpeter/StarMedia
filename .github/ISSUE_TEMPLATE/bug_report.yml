name: Bug 报告
description: 报告可以稳定复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除令牌、私人媒体信息和可识别的本地路径。
  - type: input
    id: version
    attributes:
      label: StarMedia 版本
      placeholder: 例如 0.6.20
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小且连续的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附脱敏日志、截图或媒体编码信息；请勿上传 StarMediaData。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经移除令牌、私人媒体信息和可识别的本地路径。
          required: true
